<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - SmartCart AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-form { max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .auth-form input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .auth-form button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="index.html" style="color:white;text-decoration:none;">SmartCart AI</a></div>
  </header>
  <main class="container">
    <div class="auth-form">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p style="text-align:center;margin-top:15px;">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>
  <script src="auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const res = loginUser(
        document.getElementById("email").value,
        document.getElementById("password").value
      );
      if (res.success) window.location.href = "index.html";
      else alert(res.message);
    });
  </script>
</body>
</html>
