<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - SmartCart AI</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">SmartCart AI</a></div>
      <div class="cart-icon-container" id="cart-toggles" onclick="toggleCart()">
        <span class="material-icons-outlined">shopping_cart</span>
        <span class="cart-count" id="cart-count">0</span>
      </div>
    </header>

    <main class="container">
      <a href="index.html" class="back-btn"><span class="material-icons-outlined">arrow_back</span> Back to Products</a>
      
      <div id="loading" class="loading-spinner"></div>
      <div id="error-message" class="error-message hidden"></div>

      <div class="product-details-container hidden" id="product-details">
        <!-- Product details will be injected here dynamically -->
      </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-btn" onclick="toggleCart()">
          <span class="material-icons-outlined">close</span>
        </button>
      </div>

      <div class="cart-items" id="cart-items">
        <!-- Cart items will be listed here -->
      </div>

      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cart-total-price">$0.00</span>
        </div>
        <button class="btn clear-btn" onclick="clearCart()">Clear Cart</button>
        <button class="btn checkout-btn">Checkout</button>
      </div>
    </aside>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="api.js"></script>
    <script src="cart.js"></script>
    <script src="product.js"></script>
  </body>
</html>
