<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCart AI</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">SmartCart AI</div>

      <div class="search-filter-container">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search products..."
        />
        <select id="category-filter" class="category-filter">
          <option value="all">All Categories</option>
          <!-- Categories will be injected here -->
        </select>
      </div>

      <div class="cart-icon-container" id="cart-toggles" onclick="toggleCart()">
        <span class="material-icons-outlined">shopping_cart</span>
        <span class="cart-count" id="cart-count">0</span>
      </div>
    </header>

    <main class="container">
      <!-- HERO SECTION -->
      <section class="hero-section animate-on-scroll">
        <div class="hero-content">
          <h1 class="hero-title">Discover Your Style</h1>
          <p class="hero-subtitle">
            Explore our curated collection of premium products. Quality meets
            modern elegance.
          </p>
          <a href="#products-section" class="btn hero-cta">Shop Now</a>
        </div>
      </section>

      <div id="products-section" class="products-section">
        <div id="loading" class="loading-spinner"></div>
        <div id="error-message" class="error-message hidden"></div>

        <div class="products-grid" id="products-grid">
          <!-- Products will be injected here dynamically -->
        </div>
      </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-btn" onclick="toggleCart()">
          <span class="material-icons-outlined">close</span>
        </button>
      </div>

      <div class="cart-items" id="cart-items">
        <!-- Cart items will be listed here -->
      </div>

      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cart-total-price">$0.00</span>
        </div>
        <button class="btn clear-btn" onclick="clearCart()">Clear Cart</button>
        <button class="btn checkout-btn">Checkout</button>
      </div>
    </aside>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="api.js"></script>
    <script src="cart.js"></script>
    <script src="app.js"></script>
  </body>
</html>
